name: Refresh live current affairs
on:
  schedule: [{ cron: '0 */3 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/update_content.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name "sarthi-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/ca.json; git diff --cached --quiet || (git commit -m "Refresh current affairs" && git push)
      - name: Redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo ${{ github.repository }}